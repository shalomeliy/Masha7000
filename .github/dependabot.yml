# ISO 27001 A.8.8 (technical vulnerabilities): a weekly pull request for outdated npm packages and
# GitHub Actions. Security fixes come as soon as GitHub knows of them. Every PR runs `npm run verify`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
