# Every push and pull request: lint, tests, typecheck and build (npm run verify), as on the developer's machine.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The spikes' live tests read .env.local and skip without a key; CI has none and must never spend one.
      - run: touch .env.local
      - run: npm run verify
